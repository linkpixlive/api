name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality (lint · build · test · prisma validate)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (sem --fix)
        run: pnpm lint:ci

      - name: Build
        run: pnpm build

      - name: Test (unit)
        run: pnpm test

      - name: Prisma validate
        run: pnpm prisma validate

  smoke:
    name: Smoke (migrate deploy · boot · e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkpix
          POSTGRES_PASSWORD: linkpix
          POSTGRES_DB: linkpix
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkpix"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: ci-smoke-dummy-jwt-secret-0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN_DAYS: '7'
      CORS_ORIGIN: http://localhost
      RESEND_API_KEY: re_dummy_ci
      GEMINI_KEY: dummy-ci
      EMAIL_FROM_ADDRESS: ci@example.com
      R2_ACCESS_KEY: dummy-ci
      R2_SECRET_KEY: dummy-ci
      R2_ENDPOINT_URL: http://localhost
      R2_BUCKET_NAME: dummy-ci
      BUCKET_URL: http://localhost
      LOG_LEVEL: error
      EFI_API_URL: http://localhost
      EFI_CLIENT_ID: dummy-ci
      EFI_CLIENT_SECRET: dummy-ci
      EFI_PIX_KEY: dummy-ci
      EFI_WEBHOOK_SECRET: dummy-ci
      EFI_CERTIFICATE_BASE64: ZHVtbXktY2VydGlmaWNhdGU=
      PIX_REDIRECT_DESTINATION: http://localhost
      WITHDRAWAL_FEE_PERCENTAGE: '1'
      MIN_WITHDRAWAL_AMOUNT: '1'
      MAX_PIX_KEYS_PER_USER: '5'
      PIX_EXPIRATION_SECONDS: '300'
      GRADIUM_API_KEY: dummy-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate deploy
        run: pnpm db:deploy

      - name: Build
        run: pnpm build

      - name: E2E smoke
        run: pnpm test:e2e

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (valida o Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Render)
    needs: [quality, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger deploy hook
        run: curl -fsS --max-time 30 -X POST "${RENDER_DEPLOY_HOOK_URL}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

